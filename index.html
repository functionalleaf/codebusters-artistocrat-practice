<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cryptogram Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div>
<h2>Input Ciphertext</h2>
<textarea id="ciphertext"></textarea>
<button class="big-button" onclick="generateCipher()">Generate Random Cipher</button>
<button class="big-button" onclick="checkAnswer()">Check Answer</button>
<button class="big-button" onclick="showAnswer()">Show Answer</button>
<div id="freqAnalysis"></div>
</div>

<div>
<h2>Replace Letters</h2>
<div class="replacement-inputs" id="replacementInputs"></div>
<table>
<thead>
<tr><th>Letter</th><th>English</th><th>Spanish</th></tr>
</thead>
<tbody id="freqComparison"></tbody>
</table>
</div>

<div>
<h2>Decoded Message</h2>
<div class="output" id="decodedMessage"></div>
</div>

<script src="index.js"></script>
</body>
</html>
